<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiBowan - Explore Together</title>
    <meta name="description" content="Find fellow travellers heading your way in Sri Lanka. Post the trip you're planning, or join one already forming — coordinate directly, no bookings or commissions." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#DB354E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HiBowan" />
    
    <!-- Preload critical resources -->
    <!-- DNS prefetch and preconnect for faster font loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Load Google Fonts asynchronously to prevent render blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    
    <!-- Fallback for browsers without JavaScript -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    </noscript>
    
    <!-- Font loading optimization script -->
    <script>
      // Ensure font stylesheet loads properly for older browsers
      (function() {
        var fontLink = document.querySelector('link[media="print"]');
        if (fontLink) {
          fontLink.addEventListener('load', function() {
            this.media = 'all';
          });
        }
      })();
    </script>
    
    <!-- Accessibility improvements -->
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    
    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HiBowan" />
    <meta property="og:title" content="HiBowan - Explore Together" />
    <meta property="og:description" content="Find fellow travellers heading your way in Sri Lanka. Post the trip you're planning, or join one already forming — coordinate directly, no bookings or commissions." />
    <meta property="og:url" content="https://www.hibowan.com" />
    <meta property="og:image" content="https://www.hibowan.com/hibowan-hero-share.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1081" />
    <meta property="og:image:alt" content="Traditional stilt fishermen at sunset on Sri Lanka's south coast" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hibowan.srilanka" />
    <meta name="twitter:title" content="HiBowan - Explore Together" />
    <meta name="twitter:description" content="Find fellow travellers heading your way in Sri Lanka. Coordinate directly, no bookings or commissions." />
    <meta name="twitter:image" content="https://www.hibowan.com/hibowan-hero-share.jpg" />

    <!-- Performance and SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://www.hibowan.com" />
  </head>
  <body>
    <div id="root"></div>
    <!-- React Fast Refresh preamble for CSP compliance -->
    <script type="module" src="/preamble.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>

name: 🚀 Ceylon Expand - Code Quality & CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs on new pushes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # QUALITY GATES - TypeScript, Linting, Formatting
  # ================================================================
  quality-gates:
    name: 📋 Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetch full history for better caching
          fetch-depth: 0
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 🔧 Install Dependencies
        run: npm ci --prefer-offline --no-audit
        
      - name: 🔍 TypeScript Type Checking
        run: npx tsc --noEmit
        
      - name: 🧹 ESLint Code Analysis
        run: npx eslint . --cache
        
      - name: 💄 Prettier Code Formatting
        run: npx prettier --check .
        
      - name: 🔒 Security Audit
        run: npm audit --audit-level=moderate
        continue-on-error: true # Don't fail build on audit issues
        
      - name: 📊 Bundle Analysis (PR only)
        if: github.event_name == 'pull_request'
        run: |
          npm run build
          ls -la dist/
          echo "Bundle size analysis completed"

  # ================================================================
  # COMPREHENSIVE TESTING SUITE
  # ================================================================
  test-suite:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        node-version: [18, 20]
        
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: 🔧 Install Dependencies
        run: npm ci --prefer-offline --no-audit
        
      - name: 🧪 Unit & Integration Tests
        run: npx vitest run --coverage
        
      - name: 📊 Upload Coverage Reports
        if: matrix.node-version == 18
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: Ceylon Expand Coverage
          fail_ci_if_error: false
        continue-on-error: true

  # ================================================================  
  # BUILD & DEPLOYMENT VALIDATION
  # ================================================================
  build-validation:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality-gates, test-suite]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 🔧 Install Dependencies
        run: npm ci --prefer-offline --no-audit
        
      - name: 🏗️ Production Build
        run: npm run build
        
      - name: 🔍 Build Size Analysis
        run: |
          echo "📊 Build Analysis:"
          du -sh dist/
          find dist/ -name "*.js" -exec ls -lh {} \; | head -10
          
      - name: ✅ Build Artifacts Validation
        run: |
          test -f dist/index.js || (echo "❌ Server build failed" && exit 1)
          test -d dist/public || (echo "❌ Client build failed" && exit 1)
          echo "✅ All build artifacts present"

  # ================================================================
  # SECURITY SCANNING
  # ================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 🔒 Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
        
      - name: 📊 Upload Trivy Results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ================================================================
  # PERFORMANCE TESTING (Main branch only)
  # ================================================================
  performance-test:
    name: ⚡ Performance Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    needs: [build-validation]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 🔧 Install Dependencies
        run: npm ci --prefer-offline --no-audit
        
      - name: 🏗️ Build Application
        run: npm run build
        
      - name: ⚡ Lighthouse Performance Audit
        uses: treosh/lighthouse-ci-action@v9
        with:
          configPath: './.lighthouserc.js'
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  # ================================================================
  # DEPLOYMENT READINESS CHECK
  # ================================================================
  deployment-check:
    name: 🚀 Deployment Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality-gates, test-suite, build-validation]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: ✅ All Quality Gates Passed
        run: |
          echo "🎉 All quality gates have passed successfully!"
          echo "✅ TypeScript compilation: CLEAN"
          echo "✅ Code linting: PASSED"
          echo "✅ Code formatting: CONSISTENT"
          echo "✅ Test suite: PASSED"
          echo "✅ Build validation: SUCCESS"
          echo "🚀 Application is ready for deployment!"
          
      - name: 📊 Quality Metrics Summary
        run: |
          echo "## 📊 Quality Metrics Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ TypeScript: Zero compilation errors" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ESLint: No violations detected" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Prettier: Code formatting consistent" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: All test suites passing" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build: Production build successful" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security: Vulnerability scan completed" >> $GITHUB_STEP_SUMMARY